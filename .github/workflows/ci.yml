name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q invariant_lab examples tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python -m invariant_lab.cli.main demo all
