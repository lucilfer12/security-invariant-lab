name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q invariant_lab atlas examples tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: ATLAS self-test
        run: python -m atlas.tests
      - name: ATLAS subsystem tests
        run: python -m atlas.subsystems_test
      - name: ATLAS second-wave tests
        run: python -m atlas.second_wave_test
      - name: ATLAS third-wave tests
        run: python -m atlas.third_wave_test
      - name: ATLAS eleventh-wave tests
        run: python -m atlas.eleventh_wave_test
      - name: ATLAS twelfth-wave tests
        run: python -m atlas.twelfth_wave_test
      - name: ATLAS CLI smoke test
        run: python -m atlas.cli self-test
      - name: Demo smoke test
        run: python -m invariant_lab.cli.main demo all
